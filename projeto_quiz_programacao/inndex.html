<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeQuiz — Teste seu Conhecimento</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #12121a;
    --card: #1a1a26;
    --border: #2a2a3e;
    --accent: #00f5a0;
    --accent2: #00d4ff;
    --accent3: #ff6b6b;
    --yellow: #ffd700;
    --text: #e8e8f0;
    --muted: #6b6b8a;
    --correct: #00c97a;
    --wrong: #ff4757;
    --radius: 12px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* BG grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,245,160,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,245,160,.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* ── NAV ── */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 2rem;
    height: 64px;
    background: rgba(10,10,15,.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }

  .nav-logo {
    font-family: 'Space Mono', monospace;
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: .5rem;
    cursor: pointer;
  }
  .nav-logo span { color: var(--text); }

  .nav-links { display: flex; gap: 2rem; list-style: none; }
  .nav-links a {
    color: var(--muted);
    text-decoration: none;
    font-size: .9rem;
    font-weight: 600;
    transition: color .2s;
    cursor: pointer;
  }
  .nav-links a:hover, .nav-links a.active { color: var(--accent); }

  .nav-badge {
    font-family: 'Space Mono', monospace;
    font-size: .75rem;
    background: rgba(0,245,160,.1);
    color: var(--accent);
    border: 1px solid rgba(0,245,160,.3);
    padding: .25rem .75rem;
    border-radius: 99px;
  }

  /* ── PAGES ── */
  .page {
    display: none;
    min-height: 100vh;
    padding-top: 64px;
    position: relative;
    z-index: 1;
  }
  .page.active { display: block; }

  /* ── HOME PAGE ── */
  #page-home {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 64px 1rem 4rem;
    animation: fadeIn .5s ease;
  }
  #page-home.active { display: flex; }

  .hero-tag {
    font-family: 'Space Mono', monospace;
    font-size: .75rem;
    color: var(--accent);
    border: 1px solid rgba(0,245,160,.3);
    background: rgba(0,245,160,.07);
    padding: .3rem 1rem;
    border-radius: 99px;
    letter-spacing: .1em;
    margin-bottom: 2rem;
    animation: fadeDown .6s ease both;
  }

  .hero-title {
    font-size: clamp(2.5rem, 7vw, 5rem);
    font-weight: 800;
    line-height: 1.05;
    margin-bottom: 1.5rem;
    animation: fadeDown .6s .1s ease both;
  }
  .hero-title em {
    font-style: normal;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .hero-sub {
    font-size: 1.1rem;
    color: var(--muted);
    max-width: 520px;
    line-height: 1.7;
    margin-bottom: 3rem;
    animation: fadeDown .6s .2s ease both;
  }

  .hero-btns {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    justify-content: center;
    animation: fadeDown .6s .3s ease both;
  }

  .btn {
    padding: .85rem 2rem;
    border-radius: var(--radius);
    font-family: 'Syne', sans-serif;
    font-size: .95rem;
    font-weight: 700;
    cursor: pointer;
    border: none;
    transition: transform .15s, box-shadow .15s, opacity .15s;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: .5rem;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: translateY(0); }

  .btn-primary {
    background: var(--accent);
    color: #000;
    box-shadow: 0 0 24px rgba(0,245,160,.3);
  }
  .btn-primary:hover { box-shadow: 0 0 36px rgba(0,245,160,.5); }

  .btn-secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

  .btn-danger {
    background: var(--accent3);
    color: #fff;
  }

  .stats-row {
    display: flex;
    gap: 2rem;
    margin-top: 4rem;
    flex-wrap: wrap;
    justify-content: center;
    animation: fadeDown .6s .4s ease both;
  }
  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.5rem 2rem;
    text-align: center;
    min-width: 140px;
  }
  .stat-num {
    font-family: 'Space Mono', monospace;
    font-size: 2rem;
    font-weight: 700;
    color: var(--accent);
  }
  .stat-lbl { font-size: .8rem; color: var(--muted); margin-top: .25rem; }

  /* ── CATEGORIES PAGE ── */
  #page-categories { padding: 64px 1rem 4rem; animation: fadeIn .4s ease; }
  #page-categories.active { display: block; }

  .section-header {
    text-align: center;
    padding: 3rem 0 2rem;
  }
  .section-header h2 {
    font-size: 2.2rem;
    font-weight: 800;
    margin-bottom: .5rem;
  }
  .section-header p { color: var(--muted); font-size: 1rem; }

  .categories-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 1.25rem;
    max-width: 960px;
    margin: 0 auto;
    padding: 0 1rem;
  }

  .cat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.75rem;
    cursor: pointer;
    transition: border-color .2s, transform .2s, box-shadow .2s;
    position: relative;
    overflow: hidden;
  }
  .cat-card::before {
    content: '';
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity .3s;
  }
  .cat-card:hover { transform: translateY(-4px); }
  .cat-card:hover::before { opacity: 1; }

  .cat-card[data-color="green"] { --cc: var(--accent); }
  .cat-card[data-color="blue"]  { --cc: var(--accent2); }
  .cat-card[data-color="red"]   { --cc: var(--accent3); }
  .cat-card[data-color="gold"]  { --cc: var(--yellow); }
  .cat-card[data-color="purple"]{ --cc: #c084fc; }
  .cat-card[data-color="orange"]{ --cc: #fb923c; }

  .cat-card:hover { border-color: var(--cc); box-shadow: 0 0 20px color-mix(in srgb, var(--cc) 20%, transparent); }

  .cat-icon {
    font-size: 2.5rem;
    margin-bottom: 1rem;
  }
  .cat-title { font-size: 1.15rem; font-weight: 700; margin-bottom: .4rem; }
  .cat-desc { font-size: .85rem; color: var(--muted); line-height: 1.5; margin-bottom: 1rem; }
  .cat-meta {
    display: flex;
    gap: .75rem;
    font-family: 'Space Mono', monospace;
    font-size: .7rem;
  }
  .cat-badge {
    background: rgba(255,255,255,.06);
    padding: .2rem .6rem;
    border-radius: 99px;
    color: var(--muted);
  }
  .cat-badge.hard { color: var(--accent3); background: rgba(255,71,87,.1); }
  .cat-badge.med  { color: var(--yellow);  background: rgba(255,215,0,.1); }
  .cat-badge.easy { color: var(--accent);  background: rgba(0,245,160,.1); }

  /* ── DIFFICULTY PAGE ── */
  #page-difficulty { padding: 64px 1rem 4rem; }
  #page-difficulty.active { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }

  .diff-cards {
    display: flex;
    gap: 1.25rem;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 2rem;
  }

  .diff-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 2rem;
    width: 200px;
    text-align: center;
    cursor: pointer;
    transition: border-color .2s, transform .2s, box-shadow .2s;
  }
  .diff-card:hover { transform: translateY(-4px); }
  .diff-card[data-diff="easy"]:hover  { border-color: var(--accent); box-shadow: 0 0 20px rgba(0,245,160,.2); }
  .diff-card[data-diff="med"]:hover   { border-color: var(--yellow); box-shadow: 0 0 20px rgba(255,215,0,.2); }
  .diff-card[data-diff="hard"]:hover  { border-color: var(--accent3); box-shadow: 0 0 20px rgba(255,71,87,.2); }

  .diff-icon { font-size: 2.5rem; margin-bottom: .75rem; }
  .diff-label { font-size: 1.1rem; font-weight: 700; margin-bottom: .25rem; }
  .diff-sub { font-size: .8rem; color: var(--muted); }

  /* ── QUIZ PAGE ── */
  #page-quiz { padding: 64px 1rem 4rem; }
  #page-quiz.active { display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding-top: 80px; }

  .quiz-header {
    width: 100%;
    max-width: 700px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1.5rem;
  }
  .quiz-meta {
    font-family: 'Space Mono', monospace;
    font-size: .8rem;
    color: var(--muted);
  }
  .quiz-meta strong { color: var(--text); }

  .timer {
    font-family: 'Space Mono', monospace;
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: .4rem;
  }
  .timer.warning { color: var(--accent3); animation: pulse 1s infinite; }

  .progress-bar {
    width: 100%;
    max-width: 700px;
    height: 4px;
    background: var(--border);
    border-radius: 99px;
    margin-bottom: 2rem;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 99px;
    transition: width .4s ease;
  }

  .question-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2rem;
    width: 100%;
    max-width: 700px;
    margin-bottom: 1.5rem;
    animation: fadeIn .35s ease;
  }

  .q-category {
    font-family: 'Space Mono', monospace;
    font-size: .7rem;
    color: var(--accent);
    letter-spacing: .1em;
    text-transform: uppercase;
    margin-bottom: .75rem;
  }

  .q-text {
    font-size: 1.2rem;
    font-weight: 600;
    line-height: 1.6;
    margin-bottom: 1.75rem;
  }

  .code-block {
    background: #0d0d18;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1rem 1.25rem;
    margin: 1rem 0;
    font-family: 'Space Mono', monospace;
    font-size: .82rem;
    line-height: 1.8;
    color: #c9d1d9;
    overflow-x: auto;
  }
  .code-block .kw  { color: #ff7eb6; }
  .code-block .fn  { color: #82aaff; }
  .code-block .str { color: #c3e88d; }
  .code-block .num { color: #f78c6c; }
  .code-block .cm  { color: #546e7a; }

  .options-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: .75rem;
  }

  .option-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem 1.25rem;
    color: var(--text);
    font-family: 'Syne', sans-serif;
    font-size: .92rem;
    font-weight: 600;
    cursor: pointer;
    text-align: left;
    transition: border-color .15s, background .15s, transform .1s;
    display: flex;
    align-items: center;
    gap: .75rem;
    position: relative;
    overflow: hidden;
  }
  .option-btn:hover:not(:disabled) {
    border-color: var(--accent2);
    background: rgba(0,212,255,.05);
    transform: translateX(3px);
  }
  .option-btn .opt-letter {
    font-family: 'Space Mono', monospace;
    font-size: .75rem;
    width: 26px;
    height: 26px;
    border-radius: 6px;
    background: var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-weight: 700;
  }

  .option-btn.correct {
    border-color: var(--correct);
    background: rgba(0,201,122,.1);
  }
  .option-btn.correct .opt-letter { background: var(--correct); color: #000; }

  .option-btn.wrong {
    border-color: var(--wrong);
    background: rgba(255,71,87,.1);
  }
  .option-btn.wrong .opt-letter { background: var(--wrong); color: #fff; }

  .option-btn:disabled { cursor: default; }

  .quiz-actions {
    width: 100%;
    max-width: 700px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
  }

  .hint-box {
    background: rgba(255,215,0,.07);
    border: 1px solid rgba(255,215,0,.2);
    border-radius: 10px;
    padding: 1rem 1.25rem;
    font-size: .88rem;
    color: var(--yellow);
    margin-top: 1rem;
    display: none;
    animation: fadeIn .3s ease;
  }
  .hint-box.show { display: block; }

  /* ── RESULTS PAGE ── */
  #page-results { animation: fadeIn .5s ease; }
  #page-results.active { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 80px 1rem 4rem; }

  .result-emoji { font-size: 5rem; margin-bottom: 1rem; animation: bounceIn .6s ease; }
  .result-score {
    font-family: 'Space Mono', monospace;
    font-size: 5rem;
    font-weight: 700;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: .5rem;
  }
  .result-label { font-size: 1.5rem; font-weight: 700; margin-bottom: .5rem; }
  .result-sub { color: var(--muted); font-size: 1rem; margin-bottom: 2.5rem; }

  .result-breakdown {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1rem;
    max-width: 500px;
    width: 100%;
    margin-bottom: 2.5rem;
  }
  .rb-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.25rem;
  }
  .rb-num { font-family: 'Space Mono', monospace; font-size: 1.8rem; font-weight: 700; }
  .rb-lbl { font-size: .75rem; color: var(--muted); margin-top: .25rem; }
  .rb-correct .rb-num { color: var(--correct); }
  .rb-wrong   .rb-num { color: var(--wrong); }
  .rb-time    .rb-num { color: var(--accent2); }

  .review-list {
    width: 100%;
    max-width: 700px;
    text-align: left;
    margin-bottom: 2rem;
  }
  .review-list h3 { font-size: 1rem; font-weight: 700; color: var(--muted); margin-bottom: 1rem; text-transform: uppercase; letter-spacing: .08em; font-family: 'Space Mono', monospace; font-size: .8rem; }

  .review-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem 1.25rem;
    margin-bottom: .6rem;
    display: flex;
    align-items: flex-start;
    gap: 1rem;
  }
  .review-icon { font-size: 1.2rem; flex-shrink: 0; margin-top: .1rem; }
  .review-q { font-size: .9rem; font-weight: 600; margin-bottom: .25rem; }
  .review-ans { font-size: .8rem; color: var(--muted); font-family: 'Space Mono', monospace; }

  /* ── LEADERBOARD / RANKING ── */
  #page-ranking { padding: 64px 1rem 4rem; animation: fadeIn .4s ease; }
  #page-ranking.active { display: flex; flex-direction: column; align-items: center; }

  .rank-table {
    width: 100%;
    max-width: 700px;
    margin-top: 1rem;
  }
  .rank-row {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem 1.5rem;
    margin-bottom: .5rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    transition: border-color .2s;
  }
  .rank-row:hover { border-color: var(--accent); }
  .rank-pos {
    font-family: 'Space Mono', monospace;
    font-size: 1rem;
    font-weight: 700;
    width: 32px;
    text-align: center;
    color: var(--muted);
  }
  .rank-row:nth-child(1) .rank-pos { color: #ffd700; font-size: 1.2rem; }
  .rank-row:nth-child(2) .rank-pos { color: #c0c0c0; }
  .rank-row:nth-child(3) .rank-pos { color: #cd7f32; }

  .rank-avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: .9rem;
    color: #000;
    flex-shrink: 0;
  }
  .rank-info { flex: 1; }
  .rank-name { font-weight: 700; font-size: .95rem; }
  .rank-detail { font-size: .78rem; color: var(--muted); font-family: 'Space Mono', monospace; margin-top: .1rem; }
  .rank-score {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    color: var(--accent);
    font-size: 1.1rem;
  }

  /* ── ABOUT ── */
  #page-about { padding: 64px 1rem 4rem; animation: fadeIn .4s ease; }
  #page-about.active { display: flex; flex-direction: column; align-items: center; }

  .about-content {
    max-width: 700px;
    width: 100%;
    margin-top: 1rem;
  }
  .about-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 2rem;
    margin-bottom: 1.25rem;
  }
  .about-card h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: .75rem; color: var(--accent); }
  .about-card p { font-size: .92rem; color: var(--muted); line-height: 1.7; }
  .about-card ul { padding-left: 1.25rem; color: var(--muted); font-size: .92rem; line-height: 2; }

  /* ── MODAL ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.7);
    z-index: 200;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(4px);
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2.5rem;
    max-width: 420px;
    width: 90%;
    animation: fadeIn .3s ease;
    text-align: center;
  }
  .modal h3 { font-size: 1.4rem; font-weight: 800; margin-bottom: .75rem; }
  .modal p { color: var(--muted); font-size: .95rem; margin-bottom: 2rem; line-height: 1.6; }
  .modal-btns { display: flex; gap: 1rem; justify-content: center; }

  /* ── NOTIFICATIONS ── */
  .toast {
    position: fixed;
    bottom: 2rem;
    right: 2rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem 1.5rem;
    font-size: .9rem;
    font-weight: 600;
    z-index: 300;
    animation: slideUp .3s ease;
    display: flex;
    align-items: center;
    gap: .75rem;
  }

  /* ── ANIMATIONS ── */
  @keyframes fadeIn    { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeDown  { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: none; } }
  @keyframes slideUp   { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
  @keyframes bounceIn  { 0% { transform: scale(.3); opacity: 0; } 60% { transform: scale(1.15); } 100% { transform: scale(1); opacity: 1; } }
  @keyframes pulse     { 0%,100% { opacity: 1; } 50% { opacity: .5; } }
  @keyframes spin      { to { transform: rotate(360deg); } }

  .spin { animation: spin 1s linear infinite; display: inline-block; }

  @media (max-width: 600px) {
    .options-grid { grid-template-columns: 1fr; }
    .result-breakdown { grid-template-columns: 1fr 1fr 1fr; }
    .nav-links { display: none; }
    .hero-title { font-size: 2.2rem; }
  }
</style>
</head>
<body>

<!-- ── NAVIGATION ── -->
<nav>
  <div class="nav-logo" onclick="goTo('home')">
    &lt;<span>CodeQuiz</span>/&gt;
  </div>
  <ul class="nav-links">
    <li><a onclick="goTo('home')"       id="nav-home">Início</a></li>
    <li><a onclick="goTo('categories')" id="nav-categories">Categorias</a></li>
    <li><a onclick="goTo('ranking')"    id="nav-ranking">Ranking</a></li>
    <li><a onclick="goTo('about')"      id="nav-about">Sobre</a></li>
  </ul>
